<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101927">
<title>انتخاب پلن</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{color-scheme:dark;--bg:#101927;--panel:#172438;--line:#354761;--ink:#f3f7fe;--muted:#bac9df;--accent:#8aebce}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at top,#203650,var(--bg) 52%);color:var(--ink);font:1rem/1.7 Tahoma,Arial,sans-serif}
main{max-width:570px;margin:auto;padding:32px 18px max(28px,env(safe-area-inset-bottom))}
header{margin-bottom:24px}
.eyebrow{color:var(--accent);font-size:.8rem}
h1{font-size:clamp(1.7rem,7vw,2.45rem);margin:4px 0}
h2,p{margin:0}
.intro,.meta,.hint{color:var(--muted)}
fieldset{border:0;padding:0;margin:0}
legend{font-weight:bold;margin-bottom:9px}
.options{display:grid;gap:9px}
.option{position:relative;display:block;cursor:pointer}
.option input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.card{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);padding:11px 14px;border-radius:14px}
.option input:checked+.card{border-color:var(--accent);background:#183539}
.option input:focus-visible+.card,a:focus-visible{outline:2px solid #fff;outline-offset:3px}
.meta,.price,.hint{font-size:.82rem}
.price{color:var(--accent)}
.summary{margin-top:17px;padding:15px;border:1px solid var(--line);background:var(--panel);border-radius:17px}
.summary h2{font-size:1rem;margin-bottom:4px}
#details{margin-bottom:12px}
.cta{display:block;padding:11px;text-align:center;border-radius:11px;background:var(--accent);color:#102724;font-weight:bold;text-decoration:none}
.hint{margin-top:8px;text-align:center}
</style>
</head>
<body>
<main>
<header>
<p class="eyebrow">پلن ۱</p>
<h1>مدل مناسب خودت را انتخاب کن</h1>
<p class="intro">مدت و تعداد دستگاه‌ها را مقایسه کن و برای هماهنگی به فروشنده پیام بده.</p>
</header>
<fieldset>
<legend>مدل‌ها</legend>
<div class="options" id="options"></div>
</fieldset>
<section class="summary" aria-labelledby="summary-title">
<h2 id="summary-title">انتخاب شما</h2>
<p id="details" aria-live="polite"></p>
<a class="cta" id="contact" href="https://t.me/suppport00">ادامه در پی‌وی فروشنده</a>
<p class="hint">متن آماده می‌شود و خودت دکمهٔ ارسال را می‌زنی.</p>
</section>
<noscript>برای انتخاب مدل، JavaScript مرورگر را فعال کن.</noscript>
</main>
<script>
const seller = 'suppport00';
const plan = 'پلن ۱';
const models = [
  {name:'مدل ۱', days:30, devices:1},
  {name:'مدل ۲', days:60, devices:1},
  {name:'مدل ۳', days:90, devices:1},
  {name:'مدل ۴', days:30, devices:2},
  {name:'مدل ۵', days:60, devices:2}
];
const format = new Intl.NumberFormat('fa-IR');
const describe = model => format.format(model.days) + ' روزه · ' + format.format(model.devices) + ' دستگاه';
const price = model => model.price == null ? 'استعلام قیمت' : format.format(model.price) + ' تومان';
function makeRequestLink(model) {
  const message = [
    'سلام، برای ' + plan + '، ' + model.name + ' پیام می‌دم.',
    'مشخصات انتخابی: ' + describe(model),
    model.price == null ? 'لطفاً قیمت و شرایط تهیه را بفرستید.' : 'قیمت: ' + price(model)
  ].join('\n');
  return 'https://t.me/' + seller + '?text=' + encodeURIComponent(message);
}
const options = document.getElementById('options');
const details = document.getElementById('details');
const contact = document.getElementById('contact');
function selectModel(model) {
  details.textContent = model.name + ' · ' + describe(model) + ' · ' + price(model);
  contact.href = makeRequestLink(model);
}
models.forEach((model, index) => {
  const option = document.createElement('label');
  option.className = 'option';
  const radio = document.createElement('input');
  radio.type = 'radio';
  radio.name = 'model';
  radio.checked = index === 0;
  radio.addEventListener('change', () => selectModel(model));
  const card = document.createElement('span');
  card.className = 'card';
  const info = document.createElement('span');
  const name = document.createElement('strong');
  name.textContent = model.name;
  const meta = document.createElement('span');
  meta.className = 'meta';
  meta.textContent = describe(model);
  info.append(name, document.createElement('br'), meta);
  const amount = document.createElement('span');
  amount.className = 'price';
  amount.textContent = price(model);
  card.append(info, amount);
  option.append(radio, card);
  options.append(option);
});
selectModel(models[0]);
const webApp = window.Telegram?.WebApp;
webApp?.ready();
contact.addEventListener('click', event => {
  if (webApp?.initData && typeof webApp.openTelegramLink === 'function') {
    try {
      webApp.openTelegramLink(contact.href);
      event.preventDefault();
    } catch (error) {
      // Let the browser follow the same URL if the client rejects the native call.
    }
  }
});
</script>
</body>
</html>
